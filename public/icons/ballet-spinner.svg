<!-- tutu-spinner.svg -->
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">

  <g transform="translate(60 60)">
    
    <!-- Tutu -->
    <path d="
      M-34 0
      Q0 -30 34 0
      Q0 26 -34 0Z"
      fill="#ff4f9a"
      opacity="0.9"/>

    <!-- Layers -->
    <path d="
      M-28 -2
      Q0 -22 28 -2"
      stroke="#ff9ac8"
      stroke-width="4"
      stroke-linecap="round"/>

    <path d="
      M-22 6
      Q0 -10 22 6"
      stroke="#ffb7d7"
      stroke-width="3"
      stroke-linecap="round"/>

    <!-- Waist -->
    <rect x="-10" y="-18" width="20" height="8" rx="4" fill="#2b2d42"/>

    <!-- Spin animation -->
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0"
      to="360"
      dur="3s"
      repeatCount="indefinite"/>
  </g>
</svg>